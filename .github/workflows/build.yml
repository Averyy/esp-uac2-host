name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }} (IDF ${{ matrix.idf }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Driver + hardware harness. ESP-IDF 5.4 uses the built-in USB Host
          # Library; 6.x pulls espressif/usb via the component manifest.
          - name: root-project
            path: .
            idf: v5.4
          - name: root-project
            path: .
            idf: v6.1
          - name: root-project
            path: .
            idf: v6.0.3
          # Playback + capture at once: CONFIG_UAC2_ALLOW_DUPLEX with the
          # harness's custom FIFO split (needs ESP-IDF 5.5+ / espressif/usb)
          - name: root-project-duplex
            path: .
            idf: v6.1
            command: idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.duplex.defaults" build
          - name: root-project-duplex
            path: .
            idf: v6.0.3
            command: idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.duplex.defaults" build
          - name: basic-playback-example
            path: components/usb_host_uac2/examples/basic_playback
            idf: v5.4
          - name: basic-playback-example
            path: components/usb_host_uac2/examples/basic_playback
            idf: v6.1
          # Simulator firmware used for ESP32-to-ESP32 validation
          - name: simulator-simple
            path: simulators/simple
            idf: v5.4
          - name: simulator-minidsp-2x4hd
            path: simulators/minidsp-2x4hd
            idf: v5.4
          - name: simulator-minidsp-2x4hd-no-feedback
            path: simulators/minidsp-2x4hd
            idf: v5.4
            command: idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.no-feedback.defaults" build
          - name: simulator-minidsp-2x4hd-channel-only
            path: simulators/minidsp-2x4hd
            idf: v5.4
            command: idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.channel-only.defaults" build
          - name: simulator-minidsp-2x4hd-ep0-hang
            path: simulators/minidsp-2x4hd
            idf: v5.4
            command: idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ep0-hang.defaults" build
          - name: simulator-minidsp-2x4hd-fb-drift
            path: simulators/minidsp-2x4hd
            idf: v5.4
            command: idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.fb-drift.defaults" build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.name }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: esp32s3
          path: ${{ matrix.path }}
          command: ${{ matrix.command || 'idf.py build' }}

  descriptor-parser-host-test:
    name: Descriptor parser host test (IDF v5.4 helpers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only the USB Host Library sources are needed: the parser cross-checks
      # alt settings against ESP-IDF's descriptor lookup helpers.
      - name: Checkout ESP-IDF USB Host Library
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: v5.4
          path: esp-idf
          sparse-checkout: components/usb

      - name: Run test/host/run.sh
        run: test/host/run.sh
        env:
          IDF_PATH: ${{ github.workspace }}/esp-idf
          CC: gcc

  driver-linux-test:
    name: Driver on ESP-IDF Linux target (fake USB Host Library)
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Linux target builds with the host compiler
      - name: Install host build tools
        run: apt-get update -qq && apt-get install -y -qq gcc g++ libbsd-dev

      - name: Run test/host/driver/run.sh
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          test/host/driver/run.sh
